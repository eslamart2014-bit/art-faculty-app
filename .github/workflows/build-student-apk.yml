name: Build Student Portal APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-student/**'
      - '.github/workflows/build-student-apk.yml'
    branches:
      - main
      - security/emergency-hardening

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Signing Keystore
        working-directory: android-student/app
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using production keystore from repository secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > artedu-official-release.jks
          else
            echo "Generating high-security official release keystore for CI build..."
            keytool -genkeypair -v -keystore artedu-official-release.jks -alias artedu_release \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "artedu2026portal_secure" \
              -keypass "artedu2026portal_secure" \
              -dname "CN=Faculty of Art Education, OU=Helwan University, O=Faculty of Art Education, L=Zamalek, ST=Cairo, C=EG"
          fi

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build with Gradle
        working-directory: android-student
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          KEYSTORE_FILE: artedu-official-release.jks
          KEYSTORE_PASSWORD: artedu2026portal_secure
          KEY_ALIAS: artedu_release
          KEY_PASSWORD: artedu2026portal_secure
        run: |
          gradle assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Rename APKs for clarity
        working-directory: android-student
        run: |
          mkdir -p ../dist-apk
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk ../dist-apk/ArtEdu-Student-Portal-Release.apk
          fi
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk ../dist-apk/ArtEdu-Student-Portal-Debug.apk
          fi

      - name: Upload APKs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArtEdu-Student-Portal-APKs
          path: dist-apk/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/security/emergency-hardening'
        with:
          tag_name: student-app-v1.0.5
          name: "⚡ تطبيق بوابة الطلاب - الإصدار الأصلي فائق الاستقرار v1.0.5"
          make_latest: true
          body: |
            ### تطبيق بوابة الطالب — قسم التربية الفنية 🎓 (الإصدار v1.0.5)
            - **تجربة أصلية خالية من وميض الدخول:** دخول فوري إلى لوحة الطالب دون عرض شاشة تسجيل الدخول للحسابات النشطة.
            - **دعم كامل للعمل بدون نت (Offline-First):** عرض بيانات الحساب والمشاريع مع شريط حالة التحديث مثل تطبيقات شركات الاتصالات.
            - **إلغاء السحب لإعادة التحميل (Pull to refresh):** تحريك الشاشة بسلاسة أصلية 100% دون عمل ريفرش مفاجئ.
            - **دعم شامل لأزرار الرجوع وإيماءات السحب:** إغلاق النوافذ المنبثقة ومعاينات الصور والعودة للأقسام بسلاسة تامة.
            - **أمان معتمد ومفتاح توقيع رسمي:** تشفير عالي وإزالة المفاتيح القديمة لتفادي تحذيرات الحماية وحماية بيانات الطلاب.
            - **محرك إشعارات ذكي:** تنبيه فوري بالمهام الجديدة، الحضور اليومي، اعتماد الدواليب، ورصد التقييمات.
          files: dist-apk/*.apk
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
