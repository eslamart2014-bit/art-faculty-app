name: Build Student Portal APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-student/**'
      - '.github/workflows/build-student-apk.yml'
    branches:
      - main
      - security/emergency-hardening

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build with Gradle
        working-directory: android-student
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          gradle assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Rename APKs for clarity
        working-directory: android-student
        run: |
          mkdir -p ../dist-apk
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk ../dist-apk/ArtEdu-Student-Portal-Release.apk
          fi
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk ../dist-apk/ArtEdu-Student-Portal-Debug.apk
          fi

      - name: Upload APKs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArtEdu-Student-Portal-APKs
          path: dist-apk/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/security/emergency-hardening'
        with:
          tag_name: student-app-v1.0.4
          name: "⚡ تطبيق بوابة الطلاب - الإصدار المحلي فائق السرعة v1.0.4"
          make_latest: true
          body: |
            ### تطبيق بوابة الطالب — قسم التربية الفنية 🎓
            - تجربة تطبيق أصلية حقيقية (Native App Feel) بدون أي مؤشرات متصفح.
            - واجهة رسومية محلية محملة في ذاكرة الهاتف تفتح فورياً (0 ثانية).
            - توفير 95% من بيانات الهاتف وحفظ الواجهة للعمل دون إنترنت.
          files: dist-apk/*.apk
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
