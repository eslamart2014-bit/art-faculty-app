name: Build Student Portal APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-student/**'
      - '.github/workflows/build-student-apk.yml'
    branches:
      - main
      - security/emergency-hardening

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Permanent Release Keystore
        working-directory: android-student/app
        run: |
          echo "Verifying permanent official release keystore..."
          if [ ! -f "artedu-official-release.jks" ]; then
            if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
              echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > artedu-official-release.jks
            else
              echo "Error: Permanent keystore artedu-official-release.jks not found!"
              exit 1
            fi
          fi
          ls -la artedu-official-release.jks

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Build with Gradle
        working-directory: android-student
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -o pipefail
          gradle assembleRelease assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle_err.txt || {
            echo "::error file=gradle::$(grep -E '(error:|FAILURE:|Exception|Caused by:|what went wrong)' -i /tmp/gradle_err.txt | head -n 25 | tr '\n' ' ')"
            exit 1
          }

      - name: Rename APKs for clarity
        working-directory: android-student
        run: |
          mkdir -p ../dist-apk
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk ../dist-apk/ArtEdu-Student-Portal-Release.apk
          fi
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk ../dist-apk/ArtEdu-Student-Portal-Debug.apk
          fi

      - name: Upload APKs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArtEdu-Student-Portal-APKs
          path: dist-apk/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/security/emergency-hardening'
        with:
          tag_name: student-app-v1.0.8
          name: "⚡ تطبيق بوابة الطلاب - v1.0.8"
          make_latest: true
          body: |
            يتوفر تحديث جديد للتطبيق.
          files: dist-apk/*.apk
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Broadcast Push Notification to Students
        if: github.ref == 'refs/heads/main'
        run: |
          curl -s -X POST https://art-faculty-app.vercel.app/api/push/broadcast-update \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: b8d48d9d6c9ebe4d7b675be4c795d7d0a405707b37a7dc39" \
            -d '{"version":"1.0.8","title":"⚡ يتوفر تحديث جديد","changelog":"يتوفر تحديث جديد للتطبيق."}' || true
